# Example: MobileNet with Augmentation
name: "mobilenet_v3_augmented"
description: "MobileNet V3 with data augmentation"
tags:
  - "pytorch"
  - "mobilenet"
  - "augmented"

model_type: "pytorch"
model_name: "mobilenet_v3"  # Must register this model first
model_params:
  num_classes: [12, 11, 11]
  pretrained: true

dataset_name: "masterlist_v6"
data_dir: "data/masterlist_v6"
csv_file: "masterlist_v6_full_features.csv"
train_split: 0.8
random_seed: 42

# Transform configuration
image_size: [224, 224]
normalize: true
normalize_mean: [0.485, 0.456, 0.406]  # ImageNet normalization
normalize_std: [0.229, 0.224, 0.225]
augmentation:
  random_horizontal_flip: true
  flip_prob: 0.5
  color_jitter: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.1

# Training config
batch_size: 32
num_epochs: 100
learning_rate: 0.001
optimizer: "Adam"
optimizer_params:
  weight_decay: 0.0001
scheduler: "ReduceLROnPlateau"
scheduler_params:
  mode: "min"
  factor: 0.5
  patience: 5
early_stopping_patience: 10

loss_function: "multitask_crossentropy"
loss_weights: [1.0, 1.0, 1.0]

evaluator_params:
  eos_token: -1
  weights: [0.3, 0.1]
  tol_base: 4

save_dir: "experiments"
save_model: true
save_predictions: true
save_history: true

device: "auto"
num_workers: 0
