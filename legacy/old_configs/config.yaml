paths:
  config: config                                    # Relative to project root
  root: .                                           # Project root
  data: data                                        # Relative to project root

dataset:
  name: ColourCorrectedImages                   # Change
  label_file: hair_swatch_labels_test_2.csv     # Generated by preprocess script
  color_space: RGB                              # Options: RGB, LAB

parameters:
  batch_size: 32
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: None
  optimizer: Adam
  # RNN parameters
  vocab_size: 11  # 10 bases + 1 for <eos>
  embed_dim: 256
  hidden_dim: 1024
  feat_dim: 512