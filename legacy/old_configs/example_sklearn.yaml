# Example 2: Scikit-learn Random Forest
name: "random_forest_baseline"
description: "Random Forest classifier with LAB features"
tags:
  - "sklearn"
  - "random_forest"
  - "baseline"

model_type: "sklearn"
model_name: "random_forest"
model_params:
  n_estimators: 200
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  random_state: 42
  n_jobs: -1

dataset_name: "masterlist_v6"
data_dir: "data/masterlist_v6"
csv_file: "masterlist_v6_full_features.csv"
train_split: 0.8
random_seed: 42

evaluator_params:
  eos_token: -1
  weights: [0.3, 0.1]
  tol_base: 4

save_dir: "experiments"
save_model: true
save_predictions: true
save_history: true
